<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ピヨ技術士">
<link rel="manifest" href="manifest.webmanifest">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ピヨ式 技術士一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a pocket flashcard deck; big tap targets for one-handed use on a train */
:root{
  --bg:#FFFAEB; --card:#FFFFFF; --ink:#2A2418; --muted:#7A6F5A; --line:#EFE4C6;
  --yolk:#F2B705; --yolk-soft:#FFF1BF; --yolk-ink:#5A4300;
  --ok:#2B8A3E; --ok-soft:#E3F6E7; --ng:#C92A2A; --ng-soft:#FDE8E8;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1712; --card:#25211A; --ink:#F3ECDD; --muted:#A99F8B; --line:#3A3328;
  --yolk:#FFCF33; --yolk-soft:#3A3115; --yolk-ink:#FFE38A;
  --ok:#69DB7C; --ok-soft:#1E3324; --ng:#FF8787; --ng-soft:#3A1F1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1712; --card:#25211A; --ink:#F3ECDD; --muted:#A99F8B; --line:#3A3328;
  --yolk:#FFCF33; --yolk-soft:#3A3115; --yolk-ink:#FFE38A;
  --ok:#69DB7C; --ok-soft:#1E3324; --ng:#FF8787; --ng-soft:#3A1F1F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:.02em}
.count{font-family:var(--f-display);font-weight:700;font-size:.85rem;background:var(--yolk-soft);color:var(--yolk-ink);
  padding:4px 12px;border-radius:999px;white-space:nowrap}
.count b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hello{display:flex;gap:14px;align-items:center}
.hello img{width:84px;height:84px;flex:none}
.hello p{margin:0;min-width:0}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  padding:8px 14px;border-radius:999px;cursor:pointer}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--yolk);border-color:var(--yolk);color:#2A2000}
.chip[aria-pressed="true"] small{color:#5A4300}
.btn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;
  background:var(--yolk);color:#2A2000;width:100%}
.btn.sub{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yolk);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--yolk-ink);background:var(--yolk-soft);padding:2px 8px;border-radius:6px}
.q{font-size:1.08rem;font-weight:700;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:52px}
.opt .k{font-family:var(--f-display);font-weight:800;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--yolk-soft);color:var(--yolk-ink);font-size:.85rem;margin-top:1px}
.opt span:last-child{min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--card)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng .k{background:var(--ng);color:var(--card)}
.opt:disabled{cursor:default}
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.fb img{width:64px;height:64px;flex:none}
.fb div{min-width:0}
.fb strong{font-family:var(--f-display);font-size:1.05rem;display:block}
.fb.good strong{color:var(--ok)} .fb.bad strong{color:var(--ng)}
.fb p{margin:2px 0 0;font-size:.93rem}
.score{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--muted)}
.result-top{display:flex;gap:16px;align-items:center}
.result-top img{width:100px;height:100px;flex:none}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
.miss li b{display:block;color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 160px}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  const nb=$("nums");nb.innerHTML="";
  [[10,"10問"],[20,"20問"],[50,"50問"],[0,"全部"]].forEach(([v,t])=>{
    const b=document.createElement("button");b.className="chip";b.type="button";
    b.setAttribute("aria-pressed",v===num);b.textContent=t;b.onclick=()=>{num=v;save();renderChips()};nb.appendChild(b);});
}
function save(){try{localStorage.setItem("piyo-pref",JSON.stringify({cat,num}))}catch(e){}}
try{const p=JSON.parse(localStorage.getItem("piyo-pref")||"null");if(p){cat=p.cat??cat;num=p.num??num}}catch(e){}

function show(id){["start","quiz","result"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}

function begin(set){
  lastSet=set;deck=shuffle(set);if(num&&set.length>num&&set!==misses)deck=deck.slice(0,num);
  i=0;score=0;answered=0;misses=[];show("quiz");ask();
}
function poolFor(){return cat==="all"?Q:Q.filter(q=>q[0]===cat)}

function ask(){
  const q=deck[i];
  $("pos").textContent=`${i+1} / ${deck.length}`;
  $("sc").textContent=`正解 ${score}`;
  $("barfill").style.width=`${(i/deck.length)*100}%`;
  $("tag").textContent=CATS[q[0]];
  $("qtext").textContent=q[1];
  const right=q[2][q[3]];
  const opts=shuffle(q[2]);const box=$("opts");box.innerHTML="";
  opts.forEach((t,n)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML=`<span class="k">${"ABCD"[n]}</span><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>answer(b,t===right,right);box.appendChild(b);});
  $("fb").hidden=true;$("next").hidden=true;
}
function answer(btn,ok,right){
  const q=deck[i];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.lastChild.textContent===right)b.classList.add("ok")});
  answered++;
  if(ok){score++}else{btn.classList.add("ng");misses.push(q)}
  $("sc").textContent=`正解 ${score}`;
  const fb=$("fb");fb.hidden=false;fb.className="fb "+(ok?"good":"bad");
  $("fbimg").src=ok?IMG.cheer:IMG.warn;$("fbimg").alt=ok?"喜ぶピヨちゃん":"注意するピヨちゃん";
  $("fbh").textContent=ok?pick(["正解！","いいね、その調子。","完璧。","さすが。"]):pick(["惜しい。","ここは覚え直そう。","ひっかかったね。"]);
  $("fbe").textContent=q[4];
  const nx=$("next");nx.hidden=false;nx.textContent=i+1<deck.length?"次へ":"結果を見る";nx.focus({preventScroll:true});
  nx.scrollIntoView({block:"nearest",behavior:"smooth"});
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function next(){i++;if(i<deck.length)ask();else finish()}
function finish(){
  const total=answered;
  const rate=total?score/total:0;
  show("result");
  $("rscore").innerHTML=`${score}<small> / ${total}</small>`;
  $("rimg").src=rate>=0.7?IMG.cheer:IMG.warn;
  $("rimg").alt=rate>=0.7?"喜ぶピヨちゃん":"注意するピヨちゃん";
  $("rmsg").textContent=total===0?"まだ1問も解いてないよ。":rate>=0.9?"文句なし。この調子で本番まで続けよう。":rate>=0.7?"合格ライン超え。間違えた問題だけ潰しておこう。":rate>=0.5?"ぎりぎり。間違えた問題をもう一周しよう。":"今のままだと危ない。間違えた問題からやり直し。";
  $("retryMiss").disabled=misses.length===0;
  $("missLabel").hidden=misses.length===0;
  const ul=$("miss");ul.innerHTML="";
  misses.forEach(q=>{const li=document.createElement("li");li.textContent=q[1];
    const b=document.createElement("b");b.textContent="→ "+q[2][q[3]];li.appendChild(b);ul.appendChild(li)});
}
$("go").onclick=()=>begin(poolFor());
$("next").onclick=next;
$("quit").onclick=finish;
$("retryMiss").onclick=()=>{const m=misses.slice();lastSet=m;deck=shuffle(m);i=0;score=0;answered=0;misses=[];show("quiz");ask()};
$("again").onclick=()=>begin(poolFor());
$("home").onclick=()=>{renderChips();show("start")};
renderChips();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>

</body>
</html>
